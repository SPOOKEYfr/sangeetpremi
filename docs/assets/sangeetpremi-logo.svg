<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191A20"/>
      <stop offset="100%" stop-color="#101115"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BF2"/>
      <stop offset="50%" stop-color="#9A8BFF"/>
      <stop offset="100%" stop-color="#5FD4C4"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BF2" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#5FD4C4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#101115" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="20" y="20" width="472" height="472" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#A78BF2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="#282A35" stroke-width="2"/>

  <!-- Inner emblem tile with claymorphism glow -->
  <g filter="url(#shadow)">
    <rect x="88" y="88" width="336" height="336" rx="84" fill="url(#noteGrad)"/>
    <!-- Subtle top highlight -->
    <rect x="92" y="92" width="328" height="168" rx="80" fill="white" fill-opacity="0.12"/>
  </g>

  <!-- Musical Note Glyph matching actual logo.ts (stroke-width 24 on 336 tile) -->
  <!-- In 48x48: path M17 33.5v-19l16-3.5v19, circles at (13.5, 33.5) and (29.5, 30), r=4.6 -->
  <!-- Scaled up by 7x and offset (+88 to center): x = 88 + x*7, y = 88 + y*7 -->
  <g transform="translate(88, 88) scale(7)">
    <path d="M17 33.5v-19l16-3.5v19" stroke="#101115" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="13.5" cy="33.5" r="4.6" fill="#101115"/>
    <circle cx="29.5" cy="30" r="4.6" fill="#101115"/>
  </g>
</svg>